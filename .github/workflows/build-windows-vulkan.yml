name: Build Windows Vulkan

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for artifact, e.g. v0.1.0-manual"
        required: false
        default: "manual"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-vulkan:
    runs-on: windows-latest
    env:
      BUILD_DIR: third_party/whisper.cpp/build-vulkan
      DIST_DIR: dist
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake -S third_party/whisper.cpp -B $env:BUILD_DIR -G "Visual Studio 17 2022" -A x64 -DGGML_VULKAN=1 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --parallel
      - name: Record commit
        shell: pwsh
        run: |
          $repo = "https://github.com/ggml-org/whisper.cpp"
          $branch = git -C third_party/whisper.cpp rev-parse --abbrev-ref HEAD
          $commit = git -C third_party/whisper.cpp rev-parse HEAD
          $updated = (Get-Date).ToUniversalTime().ToString("o")
          @"
          whisper.cpp repository: $repo
          branch: $branch
          commit: $commit
          updated_at: $updated
          "@ | Set-Content -Encoding UTF8 WHISPER_CPP_COMMIT.txt
      - name: Locate
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse $env:BUILD_DIR -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Recurse $env:BUILD_DIR -Filter main.exe | Select-Object -First 1 }
          if (-not $exe) { throw "whisper-cli.exe or main.exe was not found." }
          "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "exe_dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $version = "${{ github.event.inputs.version }}"; if (-not $version) { $version = "manual" } }
          New-Item -ItemType Directory -Force -Path $env:DIST_DIR,package,package/scripts | Out-Null
          Copy-Item "${{ steps.locate.outputs.exe_path }}" package/ -Force
          Get-ChildItem "${{ steps.locate.outputs.exe_dir }}" -Filter *.dll -ErrorAction SilentlyContinue | % { Copy-Item $_.FullName package/ -Force }
          Copy-Item README.md,WHISPER_CPP_COMMIT.txt package/ -Force
          if (Test-Path scripts/test-ja.ps1) { Copy-Item scripts/test-ja.ps1 package/scripts/ -Force }
          if (Test-Path scripts/diagnose.ps1) { Copy-Item scripts/diagnose.ps1 package/scripts/ -Force }
          $zip = Join-Path $env:DIST_DIR "whisper-vulkan-windows-amd-$version.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path package/* -DestinationPath $zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-vulkan-windows-amd
          path: dist/*.zip
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: WHISPER_CPP_COMMIT.txt
