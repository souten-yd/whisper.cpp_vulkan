name: Build whisper.cpp Vulkan Windows AMD

on:
  workflow_dispatch:
    inputs:
      release_tag_override:
        description: "Optional release tag override. If empty, auto-generated from whisper.cpp version."
        required: false
        default: ""
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          path: third_party/whisper.cpp
          submodules: recursive
          fetch-depth: 0

      - name: Resolve whisper.cpp version and release metadata
        id: meta
        run: |
          Set-Location third_party/whisper.cpp
          git fetch --tags --force

          $exactTag = ""
          $exactTag = git describe --tags --exact-match 2>$null

          if ($LASTEXITCODE -eq 0 -and $exactTag) {
            $upstreamVersion = $exactTag.Trim()
          } else {
            $desc = git describe --tags --abbrev=7 --always 2>$null
            if ($LASTEXITCODE -eq 0 -and $desc) {
              $upstreamVersion = $desc.Trim()
            } else {
              $upstreamVersion = (git rev-parse --short=7 HEAD).Trim()
            }
          }

          Set-Location ../..

          $safeVersion = $upstreamVersion -replace '[^A-Za-z0-9._-]', '-'
          $autoReleaseTag = "whisper-cpp-$safeVersion-vulkan-windows-amd"
          $override = "${{ github.event.inputs.release_tag_override }}"

          if ($override -and $override.Trim() -ne "") {
            $releaseTag = $override.Trim()
          } else {
            $releaseTag = $autoReleaseTag
          }

          $releaseName = "whisper.cpp Vulkan Windows AMD $upstreamVersion"
          $zipName = "whisper-cpp-$safeVersion-vulkan-windows-amd.zip"

          "upstream_version=$upstreamVersion" >> $env:GITHUB_OUTPUT
          "safe_version=$safeVersion" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

          @"
          whisper.cpp repository: https://github.com/ggml-org/whisper.cpp
          upstream_version: $upstreamVersion
          release_tag: $releaseTag
          release_name: $releaseName
          "@ | Set-Content -Encoding UTF8 WHISPER_CPP_COMMIT.txt

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true

      - name: Verify Vulkan SDK
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"

          if (-not $env:VULKAN_SDK) {
            throw "VULKAN_SDK is not set. Vulkan SDK installation failed. Check the Install Vulkan SDK step output."
          }

          $includeDir = Join-Path $env:VULKAN_SDK "Include"
          $libDir = Join-Path $env:VULKAN_SDK "Lib"
          $vulkanLib = Join-Path $libDir "vulkan-1.lib"
          $glslc = Join-Path $env:VULKAN_SDK "Bin\glslc.exe"

          if (-not (Test-Path $includeDir)) {
            throw "Vulkan include directory was not found: $includeDir. Confirm the SDK version and installer logs."
          }

          if (-not (Test-Path $libDir)) {
            throw "Vulkan lib directory was not found: $libDir. Confirm the SDK version and installer logs."
          }

          if (-not (Test-Path $vulkanLib)) {
            throw "Vulkan library was not found: $vulkanLib. Confirm the SDK installation completed successfully."
          }

          if (-not (Test-Path $glslc)) {
            throw "glslc.exe was not found: $glslc. Confirm shader tools are included in the installed SDK."
          }

          Write-Host "Vulkan include: $includeDir"
          Write-Host "Vulkan lib: $libDir"
          Write-Host "Vulkan library: $vulkanLib"
          Write-Host "glslc: $glslc"

          Get-ChildItem $env:VULKAN_SDK

      - name: Configure whisper.cpp with Vulkan
        run: |
          $vulkanInclude = Join-Path $env:VULKAN_SDK "Include"
          $vulkanLib = Join-Path $env:VULKAN_SDK "Lib\vulkan-1.lib"
          $glslc = Join-Path $env:VULKAN_SDK "Bin\glslc.exe"

          cmake -S third_party/whisper.cpp -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DGGML_VULKAN=1 `
            -DVulkan_INCLUDE_DIR="$vulkanInclude" `
            -DVulkan_LIBRARY="$vulkanLib" `
            -DVulkan_GLSLC_EXECUTABLE="$glslc" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF

      - name: Build whisper.cpp
        run: |
          cmake --build build --config Release --parallel

      - name: Package binaries
        run: |
          New-Item -ItemType Directory -Force package | Out-Null

          if (Test-Path "build\bin\Release") {
            Copy-Item "build\bin\Release\*.exe" package\ -ErrorAction SilentlyContinue
            Copy-Item "build\bin\Release\*.dll" package\ -ErrorAction SilentlyContinue
          }

          if (Test-Path "build\examples\Release") {
            Copy-Item "build\examples\Release\*.exe" package\ -ErrorAction SilentlyContinue
            Copy-Item "build\examples\Release\*.dll" package\ -ErrorAction SilentlyContinue
          }

          if (Test-Path "third_party\whisper.cpp\README.md") {
            Copy-Item "third_party\whisper.cpp\README.md" package\README-whisper.cpp.md -ErrorAction SilentlyContinue
          }

          @"
          whisper.cpp Vulkan Windows AMD build

          Upstream whisper.cpp version:
          ${{ steps.meta.outputs.upstream_version }}

          Release tag:
          ${{ steps.meta.outputs.release_tag }}

          Notes:
          - Built from ggml-org/whisper.cpp
          - Vulkan enabled
          - Target: Windows x64 / AMD GPU Vulkan runtime
          "@ | Out-File -Encoding utf8 package\BUILD_INFO.txt

          Compress-Archive -Path package\* -DestinationPath "${{ steps.meta.outputs.zip_name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-vulkan-windows-amd
          path: ${{ steps.meta.outputs.zip_name }}

      - name: Create or update Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $tag = "${{ steps.meta.outputs.release_tag }}"
          git tag -f $tag
          git push origin -f $tag

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_name }}
          files: ${{ steps.meta.outputs.zip_name }}
          body_path: WHISPER_CPP_COMMIT.txt
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
